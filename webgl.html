<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Real-Time 3D Graphics with WebGL2</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 5px dotted blue;
    }
  </style>
</head>
<body>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, 800 / 600, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(800, 600);
    renderer.setClearColor(0xf0f0f0);
    document.body.appendChild(renderer.domElement);

    // Add border to canvas matching original
    renderer.domElement.style.border = "5px dotted blue";

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Define 6 text contents for each face
    const faceTexts = [
      { title: "About Me", lines: ["Backend engineer", "Reliable & Scalable systems", "Caching, replication, observability"] },
      { title: "Tech Stack", lines: ["JavaScript, TypeScript", "Node.js, Golang", "GCP, Docker"] },
      { title: "VK Reader", lines: ["Chrome Extension", "AI reading & summarizing", "OpenAI/Gemini, Vite"] },
      { title: "Memorizer", lines: ["Chrome Extension", "Highlighting & Screenshots", "Google Drive Sync"] },
      { title: "Smart Cookies", lines: ["YouTube Channel", "Automated quiz videos", "Python, GCP, LLMs"] },
      { title: "Contact Info", lines: ["LinkedIn: qvietky", "GitHub: vietky", "vietky-forwork@gmail.com"] }
    ];

    function createTextTexture(textObj) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Border
      ctx.strokeStyle = '#333333';
      ctx.lineWidth = 10;
      ctx.strokeRect(0, 0, canvas.width, canvas.height);

      // Title
      ctx.fillStyle = '#1a1a1a';
      ctx.font = 'bold 48px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(textObj.title, 256, 100);

      // Lines
      ctx.font = '32px Arial';
      ctx.fillStyle = '#4a4a4a';
      for (let i = 0; i < textObj.lines.length; i++) {
        ctx.fillText(textObj.lines[i], 256, 220 + (i * 60));
      }

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    const materials = faceTexts.map(text => {
      return new THREE.MeshBasicMaterial({ map: createTextTexture(text) });
    });

    const geometry = new THREE.BoxGeometry(3, 3, 3);
    const cube = new THREE.Mesh(geometry, materials);
    scene.add(cube);

    camera.position.z = 5;

    function animate() {
      requestAnimationFrame(animate);

      // Slowly rotate the cube
      cube.rotation.x += 0.005;
      cube.rotation.y += 0.005;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>

</body>
</html>
